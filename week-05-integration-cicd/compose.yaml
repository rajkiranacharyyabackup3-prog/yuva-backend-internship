services:
  postgres:
    image: postgres:17-alpine
    container_name: yuva-blog-postgres
    environment:
      POSTGRES_DB: blogdb
      POSTGRES_USER: blog_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_blog_only_change_me}
    ports:
      - "5432:5432"
    volumes:
      - blog-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog_user -d blogdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  blog-postgres-data:
