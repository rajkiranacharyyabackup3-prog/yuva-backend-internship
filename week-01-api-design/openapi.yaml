"openapi": "3.0.3"
"info":
  "title": "YuvaIntern Simple E-commerce API"
  "version": "1.0.0"
  "description": "Week 1 API design contract. Proposed target: Java with Spring Boot and PostgreSQL. This specification is not an implemented service."
"servers":
  -
    "url": "http://localhost:8080/api/v1"
    "description": "Local development server"
"tags":
  -
    "name": "Authentication"
  -
    "name": "Users"
  -
    "name": "Products"
  -
    "name": "Orders"
  -
    "name": "Inventory"
"paths":
  "/auth/login":
    "post":
      "tags":
        - "Authentication"
      "summary": "Log in"
      "description": "Verify credentials and issue a short-lived token."
      "operationId": "authenticationLogIn"
      "responses":
        "200":
          "description": "Successful response."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/AuthToken"
        "400":
          "description": "Malformed input or validation failure."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "401":
          "description": "Authentication is required or invalid."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "429":
          "description": "Rate limit exceeded."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "500":
          "description": "Unexpected server error."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/LoginRequest"
  "/users":
    "post":
      "tags":
        - "Users"
      "summary": "Register user"
      "description": "Public registration creates CUSTOMER only."
      "operationId": "usersRegisterUser"
      "responses":
        "201":
          "description": "Created."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/User"
        "400":
          "description": "Malformed input or validation failure."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "409":
          "description": "State, stock, or uniqueness conflict."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "422":
          "description": "Business rule violation."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "429":
          "description": "Rate limit exceeded."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "500":
          "description": "Unexpected server error."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/RegisterUserRequest"
    "get":
      "tags":
        - "Users"
      "summary": "List users"
      "description": "List accounts for administration. Requires ADMIN."
      "operationId": "usersListUsers"
      "responses":
        "200":
          "description": "Successful response."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/UserPage"
        "401":
          "description": "Authentication is required or invalid."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "403":
          "description": "Administrator access is required."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "429":
          "description": "Rate limit exceeded."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "500":
          "description": "Unexpected server error."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
      "security":
        -
          "BearerAuth": []
      "parameters":
        -
          "name": "limit"
          "in": "query"
          "required": false
          "description": "Page size from 1 to 100; default 20."
          "schema":
            "type": "integer"
            "minimum": 1
            "maximum": 100
            "default": 20
        -
          "name": "cursor"
          "in": "query"
          "required": false
          "description": "Opaque cursor from the previous page."
          "schema":
            "type": "string"
  "/users/{userId}":
    "get":
      "tags":
        - "Users"
      "summary": "Get user"
      "description": "Return own profile or a profile to an administrator. Requires a valid bearer token and resource-level authorization."
      "operationId": "usersGetUser"
      "responses":
        "200":
          "description": "Successful response."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/User"
        "401":
          "description": "Authentication is required or invalid."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "403":
          "description": "Administrator access is required."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "404":
          "description": "Resource missing or not visible."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "500":
          "description": "Unexpected server error."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
      "security":
        -
          "BearerAuth": []
      "parameters":
        -
          "name": "userId"
          "in": "path"
          "required": true
          "description": "User UUID."
          "schema":
            "type": "string"
            "format": "uuid"
    "put":
      "tags":
        - "Users"
      "summary": "Replace user profile"
      "description": "Replace editable fields; customers cannot change role or status. Requires a valid bearer token and resource-level authorization."
      "operationId": "usersReplaceUserProfile"
      "responses":
        "200":
          "description": "Successful response."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/User"
        "400":
          "description": "Malformed input or validation failure."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "401":
          "description": "Authentication is required or invalid."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "403":
          "description": "Administrator access is required."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "404":
          "description": "Resource missing or not visible."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "409":
          "description": "State, stock, or uniqueness conflict."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "422":
          "description": "Business rule violation."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "500":
          "description": "Unexpected server error."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
      "security":
        -
          "BearerAuth": []
      "parameters":
        -
          "name": "userId"
          "in": "path"
          "required": true
          "description": "User UUID."
          "schema":
            "type": "string"
            "format": "uuid"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/UserUpdateRequest"
    "delete":
      "tags":
        - "Users"
      "summary": "Deactivate user"
      "description": "Soft-deactivate account and retain order history. Requires a valid bearer token and resource-level authorization."
      "operationId": "usersDeactivateUser"
      "responses":
        "204":
          "description": "No response body."
        "401":
          "description": "Authentication is required or invalid."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "403":
          "description": "Administrator access is required."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "404":
          "description": "Resource missing or not visible."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "409":
          "description": "State, stock, or uniqueness conflict."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "500":
          "description": "Unexpected server error."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
      "security":
        -
          "BearerAuth": []
      "parameters":
        -
          "name": "userId"
          "in": "path"
          "required": true
          "description": "User UUID."
          "schema":
            "type": "string"
            "format": "uuid"
  "/products":
    "get":
      "tags":
        - "Products"
      "summary": "List products"
      "description": "Browse active products with filters and cursor pagination."
      "operationId": "productsListProducts"
      "responses":
        "200":
          "description": "Successful response."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ProductPage"
        "400":
          "description": "Malformed input or validation failure."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "429":
          "description": "Rate limit exceeded."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "500":
          "description": "Unexpected server error."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
      "parameters":
        -
          "name": "limit"
          "in": "query"
          "required": false
          "description": "Page size from 1 to 100; default 20."
          "schema":
            "type": "integer"
            "minimum": 1
            "maximum": 100
            "default": 20
        -
          "name": "cursor"
          "in": "query"
          "required": false
          "description": "Opaque cursor from the previous page."
          "schema":
            "type": "string"
        -
          "name": "q"
          "in": "query"
          "required": false
          "description": "Search product name, SKU, or description."
          "schema":
            "type": "string"
            "maxLength": 100
        -
          "name": "category"
          "in": "query"
          "required": false
          "description": "Exact category filter."
          "schema":
            "type": "string"
        -
          "name": "inStock"
          "in": "query"
          "required": false
          "description": "Only products with available inventory."
          "schema":
            "type": "boolean"
    "post":
      "tags":
        - "Products"
      "summary": "Create product"
      "description": "Create a catalog product; initialize stock separately. Requires ADMIN."
      "operationId": "productsCreateProduct"
      "responses":
        "201":
          "description": "Created."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Product"
        "400":
          "description": "Malformed input or validation failure."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "401":
          "description": "Authentication is required or invalid."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "403":
          "description": "Administrator access is required."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "409":
          "description": "State, stock, or uniqueness conflict."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "422":
          "description": "Business rule violation."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "500":
          "description": "Unexpected server error."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
      "security":
        -
          "BearerAuth": []
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/ProductWriteRequest"
  "/products/{productId}":
    "get":
      "tags":
        - "Products"
      "summary": "Get product"
      "description": "Publicly return active product. A valid ADMIN bearer token may also read an archived product; an invalid supplied token returns 401."
      "operationId": "productsGetProduct"
      "responses":
        "200":
          "description": "Successful response."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Product"
        "401":
          "description": "Authentication is required or invalid."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "404":
          "description": "Resource missing or not visible."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "429":
          "description": "Rate limit exceeded."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "500":
          "description": "Unexpected server error."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
      "security":
        -
          "BearerAuth": []
        - {}
      "parameters":
        -
          "name": "productId"
          "in": "path"
          "required": true
          "description": "Product UUID."
          "schema":
            "type": "string"
            "format": "uuid"
    "put":
      "tags":
        - "Products"
      "summary": "Replace product"
      "description": "Replace editable catalog fields. Requires ADMIN."
      "operationId": "productsReplaceProduct"
      "responses":
        "200":
          "description": "Successful response."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Product"
        "400":
          "description": "Malformed input or validation failure."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "401":
          "description": "Authentication is required or invalid."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "403":
          "description": "Administrator access is required."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "404":
          "description": "Resource missing or not visible."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "409":
          "description": "State, stock, or uniqueness conflict."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "422":
          "description": "Business rule violation."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "500":
          "description": "Unexpected server error."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
      "security":
        -
          "BearerAuth": []
      "parameters":
        -
          "name": "productId"
          "in": "path"
          "required": true
          "description": "Product UUID."
          "schema":
            "type": "string"
            "format": "uuid"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/ProductWriteRequest"
    "delete":
      "tags":
        - "Products"
      "summary": "Archive product"
      "description": "Soft-archive and preserve historical order snapshots. Requires ADMIN."
      "operationId": "productsArchiveProduct"
      "responses":
        "204":
          "description": "No response body."
        "401":
          "description": "Authentication is required or invalid."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "403":
          "description": "Administrator access is required."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "404":
          "description": "Resource missing or not visible."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "409":
          "description": "State, stock, or uniqueness conflict."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "500":
          "description": "Unexpected server error."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
      "security":
        -
          "BearerAuth": []
      "parameters":
        -
          "name": "productId"
          "in": "path"
          "required": true
          "description": "Product UUID."
          "schema":
            "type": "string"
            "format": "uuid"
  "/orders":
    "get":
      "tags":
        - "Orders"
      "summary": "List orders"
      "description": "Customers see own orders; administrators may see all. Requires a valid bearer token and resource-level authorization."
      "operationId": "ordersListOrders"
      "responses":
        "200":
          "description": "Successful response."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/OrderPage"
        "401":
          "description": "Authentication is required or invalid."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "403":
          "description": "Administrator access is required."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "429":
          "description": "Rate limit exceeded."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "500":
          "description": "Unexpected server error."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
      "security":
        -
          "BearerAuth": []
      "parameters":
        -
          "name": "limit"
          "in": "query"
          "required": false
          "description": "Page size from 1 to 100; default 20."
          "schema":
            "type": "integer"
            "minimum": 1
            "maximum": 100
            "default": 20
        -
          "name": "cursor"
          "in": "query"
          "required": false
          "description": "Opaque cursor from the previous page."
          "schema":
            "type": "string"
        -
          "name": "status"
          "in": "query"
          "required": false
          "description": "Filter by status."
          "schema":
            "type": "string"
            "enum":
              - "PLACED"
              - "CANCELLED"
    "post":
      "tags":
        - "Orders"
      "summary": "Place order"
      "description": "Calculate prices server-side and reserve stock atomically. Requires a valid bearer token and resource-level authorization."
      "operationId": "ordersPlaceOrder"
      "responses":
        "201":
          "description": "Created."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Order"
          "headers":
            "Location":
              "description": "URI of the created order resource."
              "schema":
                "type": "string"
                "format": "uri-reference"
        "400":
          "description": "Malformed input or validation failure."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "401":
          "description": "Authentication is required or invalid."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "403":
          "description": "Administrator access is required."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "404":
          "description": "Resource missing or not visible."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "409":
          "description": "State, stock, or uniqueness conflict."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "422":
          "description": "Business rule violation."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "429":
          "description": "Rate limit exceeded."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "500":
          "description": "Unexpected server error."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
      "security":
        -
          "BearerAuth": []
      "parameters":
        -
          "name": "Idempotency-Key"
          "in": "header"
          "required": true
          "description": "Reuse the same key when retrying this create request."
          "schema":
            "type": "string"
            "minLength": 16
            "maxLength": 128
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/OrderCreateRequest"
  "/orders/{orderId}":
    "get":
      "tags":
        - "Orders"
      "summary": "Get order"
      "description": "Return order to its owner or an administrator. Requires a valid bearer token and resource-level authorization."
      "operationId": "ordersGetOrder"
      "responses":
        "200":
          "description": "Successful response."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Order"
        "401":
          "description": "Authentication is required or invalid."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "404":
          "description": "Resource missing or not visible."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
        "500":
          "description": "Unexpected server error."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
      "security":
