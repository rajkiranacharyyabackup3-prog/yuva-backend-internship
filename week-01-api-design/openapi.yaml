"components":
  "securitySchemes":
    "BearerAuth":
      "type": "http"
      "scheme": "bearer"
      "bearerFormat": "JWT"
  "schemas":
    "Problem":
      "type": "object"
      "required":
        - "type"
        - "title"
        - "status"
        - "code"
        - "detail"
        - "instance"
      "properties":
        "type":
          "type": "string"
        "title":
          "type": "string"
        "status":
          "type": "integer"
        "code":
          "type": "string"
        "detail":
          "type": "string"
        "instance":
          "type": "string"
        "fieldErrors":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/FieldError"
    "FieldError":
      "type": "object"
      "required":
        - "field"
        - "message"
      "properties":
        "field":
          "type": "string"
        "message":
          "type": "string"
    "RegisterUserRequest":
      "type": "object"
      "required":
        - "email"
        - "password"
        - "fullName"
      "additionalProperties": false
      "properties":
        "email":
          "type": "string"
          "format": "email"
          "maxLength": 254
        "password":
          "type": "string"
          "format": "password"
          "minLength": 12
          "maxLength": 128
        "fullName":
          "type": "string"
          "minLength": 1
          "maxLength": 120
    "LoginRequest":
      "type": "object"
      "required":
        - "email"
        - "password"
      "additionalProperties": false
      "properties":
        "email":
          "type": "string"
          "format": "email"
        "password":
          "type": "string"
          "format": "password"
    "AuthToken":
      "type": "object"
      "required":
        - "accessToken"
        - "tokenType"
        - "expiresInSeconds"
        - "user"
      "properties":
        "accessToken":
          "type": "string"
        "tokenType":
          "type": "string"
          "enum":
            - "Bearer"
        "expiresInSeconds":
          "type": "integer"
        "user":
          "$ref": "#/components/schemas/User"
    "User":
      "type": "object"
      "required":
        - "id"
        - "email"
        - "fullName"
        - "role"
        - "active"
        - "createdAt"
        - "updatedAt"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "email":
          "type": "string"
          "format": "email"
        "fullName":
          "type": "string"
        "role":
          "type": "string"
          "enum":
            - "CUSTOMER"
            - "ADMIN"
        "active":
          "type": "boolean"
        "createdAt":
          "type": "string"
          "format": "date-time"
        "updatedAt":
          "type": "string"
          "format": "date-time"
    "UserUpdateRequest":
      "type": "object"
      "required":
        - "email"
        - "fullName"
      "additionalProperties": false
      "properties":
        "email":
          "type": "string"
          "format": "email"
          "maxLength": 254
        "fullName":
          "type": "string"
          "minLength": 1
          "maxLength": 120
    "UserPage":
      "type": "object"
      "required":
        - "items"
      "properties":
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/User"
        "nextCursor":
          "type": "string"
          "nullable": true
    "ProductWriteRequest":
      "type": "object"
      "required":
        - "sku"
        - "name"
        - "description"
        - "category"
        - "pricePaise"
      "additionalProperties": false
      "properties":
        "sku":
          "type": "string"
          "minLength": 1
          "maxLength": 64
        "name":
          "type": "string"
          "minLength": 1
          "maxLength": 160
        "description":
          "type": "string"
          "maxLength": 4000
        "category":
          "type": "string"
          "minLength": 1
          "maxLength": 80
        "pricePaise":
          "type": "integer"
          "minimum": 1
          "description": "INR amount in paise."
    "Product":
      "type": "object"
      "required":
        - "id"
        - "sku"
        - "name"
        - "description"
        - "category"
        - "pricePaise"
        - "currency"
        - "active"
        - "inStock"
        - "createdAt"
        - "updatedAt"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "sku":
          "type": "string"
        "name":
          "type": "string"
        "description":
          "type": "string"
        "category":
          "type": "string"
        "pricePaise":
          "type": "integer"
          "minimum": 1
        "currency":
          "type": "string"
          "enum":
            - "INR"
        "active":
          "type": "boolean"
        "inStock":
          "type": "boolean"
        "createdAt":
          "type": "string"
          "format": "date-time"
        "updatedAt":
          "type": "string"
          "format": "date-time"
    "ProductPage":
      "type": "object"
      "required":
        - "items"
      "properties":
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/Product"
        "nextCursor":
          "type": "string"
          "nullable": true
    "Address":
      "type": "object"
      "required":
        - "recipientName"
        - "line1"
        - "city"
        - "state"
        - "postalCode"
        - "countryCode"
      "additionalProperties": false
      "properties":
        "recipientName":
          "type": "string"
          "maxLength": 120
        "line1":
          "type": "string"
          "maxLength": 180
        "line2":
          "type": "string"
          "maxLength": 180
        "city":
          "type": "string"
          "maxLength": 100
        "state":
          "type": "string"
          "maxLength": 100
        "postalCode":
          "type": "string"
          "maxLength": 20
        "countryCode":
          "type": "string"
          "enum":
            - "IN"
    "OrderLineRequest":
      "type": "object"
      "required":
        - "productId"
        - "quantity"
      "additionalProperties": false
      "properties":
        "productId":
          "type": "string"
          "format": "uuid"
        "quantity":
          "type": "integer"
          "minimum": 1
          "maximum": 50
    "OrderCreateRequest":
      "type": "object"
      "required":
        - "items"
        - "shippingAddress"
      "additionalProperties": false
      "properties":
        "items":
          "type": "array"
          "minItems": 1
          "maxItems": 50
          "items":
            "$ref": "#/components/schemas/OrderLineRequest"
        "shippingAddress":
          "$ref": "#/components/schemas/Address"
        "customerNote":
          "type": "string"
          "maxLength": 500
    "OrderUpdateRequest":
      "type": "object"
      "required":
        - "shippingAddress"
      "additionalProperties": false
      "properties":
        "shippingAddress":
          "$ref": "#/components/schemas/Address"
        "customerNote":
          "type": "string"
          "maxLength": 500
    "OrderItem":
      "type": "object"
      "required":
        - "productId"
        - "sku"
        - "productName"
        - "quantity"
        - "unitPricePaise"
        - "lineTotalPaise"
      "properties":
        "productId":
          "type": "string"
          "format": "uuid"
        "sku":
          "type": "string"
        "productName":
          "type": "string"
        "quantity":
          "type": "integer"
        "unitPricePaise":
          "type": "integer"
        "lineTotalPaise":
          "type": "integer"
    "Order":
      "type": "object"
      "required":
        - "id"
        - "orderNumber"
        - "userId"
        - "status"
        - "items"
        - "subtotalPaise"
        - "currency"
        - "shippingAddress"
        - "createdAt"
        - "updatedAt"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "orderNumber":
          "type": "string"
        "userId":
          "type": "string"
          "format": "uuid"
        "status":
          "type": "string"
          "enum":
            - "PLACED"
            - "CANCELLED"
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/OrderItem"
        "subtotalPaise":
          "type": "integer"
        "currency":
          "type": "string"
          "enum":
            - "INR"
        "shippingAddress":
          "$ref": "#/components/schemas/Address"
        "customerNote":
          "type": "string"
          "nullable": true
        "createdAt":
          "type": "string"
          "format": "date-time"
        "updatedAt":
          "type": "string"
          "format": "date-time"
    "OrderPage":
      "type": "object"
      "required":
        - "items"
      "properties":
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/Order"
        "nextCursor":
          "type": "string"
          "nullable": true
    "InventoryCreateRequest":
      "type": "object"
      "required":
        - "productId"
        - "onHandQuantity"
        - "reorderPoint"
      "additionalProperties": false
      "properties":
        "productId":
          "type": "string"
          "format": "uuid"
        "onHandQuantity":
          "type": "integer"
          "minimum": 0
        "reorderPoint":
          "type": "integer"
          "minimum": 0
    "InventoryUpdateRequest":
      "type": "object"
      "required":
        - "reorderPoint"
      "additionalProperties": false
      "properties":
        "reorderPoint":
          "type": "integer"
          "minimum": 0
    "Inventory":
      "type": "object"
      "required":
        - "productId"
        - "onHandQuantity"
        - "reservedQuantity"
        - "availableQuantity"
        - "reorderPoint"
        - "updatedAt"
      "properties":
        "productId":
          "type": "string"
          "format": "uuid"
        "onHandQuantity":
          "type": "integer"
          "minimum": 0
        "reservedQuantity":
          "type": "integer"
          "minimum": 0
        "availableQuantity":
          "type": "integer"
          "minimum": 0
          "readOnly": true
          "description": "onHandQuantity minus reservedQuantity."
        "reorderPoint":
          "type": "integer"
          "minimum": 0
        "updatedAt":
          "type": "string"
